<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Review — Vokari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink-950: #1a1711;
      --ink-900: #201c14;
      --surface: #26211a;
      --surface-raised: #322b20;
      --border: #3c3323;
      --paper: #f4efe4;
      --text-secondary: #b7ac97;
      --text-tertiary: #7d7460;
      --gold: #ffb627;
      --gold-ink: #3a2a05;
      --coral: #ff6b5e;
      --mint: #5eead4;
      --mint-ink: #063c34;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--ink-950);
      background-image: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,182,39,0.06), transparent 60%);
      color: var(--paper);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      padding: 16px 20px 14px;
    }
    .page-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .brand-mark {
      position: relative;
      display: inline-block;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 700;
      font-size: 22px;
      color: var(--paper);
      letter-spacing: -0.01em;
    }
    .brand-mark::before {
      content: "";
      position: absolute;
      left: -4px; right: -6px; bottom: 2px;
      height: 36%;
      background: var(--gold);
      opacity: 0.88;
      transform: skewX(-8deg) rotate(-1deg);
      z-index: -1;
      border-radius: 1px 6px 2px 5px;
    }
    .brand-tag {
      margin-top: 2px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-tertiary);
    }
    #scopeBar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12.5px;
      color: var(--text-secondary);
      max-width: 700px;
      justify-content: center;
      flex-shrink: 0;
    }
    #scopeBar > span:first-child {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
    }
    #scopeBar select, #scopeBar input {
      background: var(--surface);
      color: var(--paper);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 12.5px;
      font-family: inherit;
    }
    #scopeBar select:focus, #scopeBar input:focus { outline: none; border-color: var(--gold); }
    #scopeBar input[type="number"] {
      width: 50px;
    }
    #scopeBar button {
      background: var(--gold);
      color: var(--gold-ink);
      border: none;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    #scopeBar button:hover { filter: brightness(1.08); }
    #levelFilter {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    #levelFilter label {
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: "IBM Plex Mono", monospace;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 7px;
      cursor: pointer;
      user-select: none;
      font-size: 11px;
    }
    #levelFilter input { margin: 0; accent-color: var(--gold); }
    #progress {
      font-family: "IBM Plex Mono", monospace;
      color: var(--text-tertiary);
      font-size: 11.5px;
      margin-bottom: 10px;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }

    /* --- three-column layout --- */
    #reviewGrid {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 18px;
      width: 100%;
      max-width: 1220px;
      flex: 1;
      min-height: 0;
    }
    .col {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .col-side {
      flex: 1 1 0;
      max-width: 300px;
      background: var(--ink-900);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .col-mid {
      flex: 1.35 1 0;
      max-width: 460px;
      align-items: center;
      padding: 2px 2px 10px;
    }
    .col-heading {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      text-align: center;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    #card {
      width: 100%;
      min-height: 210px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 26px 24px;
      cursor: pointer;
      text-align: center;
      gap: 12px;
      position: relative;
      flex-shrink: 0;
    }
    #levelBadge {
      position: absolute;
      top: 14px;
      right: 16px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10.5px;
      color: var(--text-secondary);
      background: var(--ink-900);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px 9px;
    }
    #levelBadge.lvl-low { color: var(--mint-ink); background: var(--mint); border-color: var(--mint); }
    #levelBadge.lvl-mid { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
    #levelBadge.lvl-high { color: #3a0f0a; background: var(--coral); border-color: var(--coral); }
    #speakBtn {
      position: absolute;
      top: 12px;
      left: 14px;
      font-size: 15px;
      background: var(--ink-900);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      color: var(--paper);
    }
    #speakBtn:hover { background: var(--surface-raised); }
    #word {
      font-family: "Fraunces", Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--paper);
    }
    #translation {
      position: relative;
      font-size: 18px;
      color: var(--paper);
      display: none;
      padding: 2px 6px;
    }
    #translation.revealed {
      display: block;
      animation: vk-fadein 0.35s ease 0.12s both;
    }
    #translation.revealed::before {
      content: "";
      position: absolute;
      left: -6px; right: -6px; top: 10%; bottom: 10%;
      background: var(--mint);
      opacity: 0.22;
      border-radius: 4px;
      transform-origin: left center;
      animation: vk-swipe 0.45s cubic-bezier(.22,.8,.25,1);
      z-index: -1;
    }
    @keyframes vk-swipe {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes vk-fadein {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #context {
      font-size: 12.5px;
      color: var(--text-tertiary);
      max-width: 320px;
    }
    #notes {
      display: none;
      font-size: 12px;
      color: var(--text-secondary);
      max-width: 320px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 11px;
      white-space: pre-wrap;
      text-align: left;
    }
    #notes.revealed {
      display: block;
      animation: vk-fadein 0.35s ease 0.18s both;
    }
    #hint {
      font-family: "IBM Plex Mono", monospace;
      font-size: 10.5px;
      letter-spacing: 0.03em;
      color: var(--text-tertiary);
    }

    /* AI sentence column */
    #sentencePanel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #sentenceBtn {
      background: var(--surface);
      color: var(--paper);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
    }
    #sentenceBtn:hover { background: var(--surface-raised); border-color: var(--text-tertiary); }
    #sentenceBtn:disabled { opacity: 0.5; cursor: default; }
    #sentenceBtn.loading::after {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 8px;
      border-radius: 50%;
      background: var(--gold);
      animation: vk-pulse 1s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes vk-pulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    #sentenceBox {
      display: none;
      position: relative;
      width: 100%;
      box-sizing: border-box;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 32px 12px 14px;
      font-size: 13.5px;
      line-height: 1.5;
      text-align: left;
    }
    #sentenceBox mark {
      background: rgba(255, 182, 39, 0.22);
      color: var(--paper);
      border-radius: 4px;
      padding: 0 3px;
      font-weight: 600;
    }
    #favoriteBtn {
      position: absolute;
      top: 8px;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      color: var(--text-tertiary);
      padding: 2px;
      line-height: 1;
    }
    #favoriteBtn:hover { color: var(--gold); }
    #favoriteBtn.favorited { color: var(--gold); }
    #historyToggle {
      display: none;
      align-self: flex-start;
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
    #historyToggle:hover { color: var(--text-secondary); }
    #historyList {
      display: none;
      width: 100%;
      max-height: 150px;
      overflow-y: auto;
      box-sizing: border-box;
      flex-direction: column;
      gap: 5px;
    }
    #sentenceError {
      display: none;
      font-size: 11.5px;
      color: var(--coral);
      text-align: center;
    }
    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 11.5px;
      color: var(--text-secondary);
      cursor: pointer;
      text-align: left;
      line-height: 1.4;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .history-item:hover { background: var(--surface-raised); }
    .history-item .star { color: var(--gold); }
    .history-del {
      flex-shrink: 0;
      color: var(--text-tertiary);
      padding: 0 2px;
    }
    .history-del:hover { color: var(--coral); }

    /* Practice column */
    #practicePanel {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #practiceIntro {
      font-size: 11.5px;
      color: var(--text-tertiary);
      text-align: center;
    }
    #practiceInput {
      width: 100%;
      box-sizing: border-box;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--paper);
      font-size: 12.5px;
      padding: 9px 11px;
      resize: vertical;
      font-family: inherit;
    }
    #practiceInput:focus { outline: none; border-color: var(--gold); }
    #practiceBtn {
      background: var(--surface);
      color: var(--paper);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
    }
    #practiceBtn:hover { background: var(--surface-raised); border-color: var(--text-tertiary); }
    #practiceBtn:disabled { opacity: 0.5; cursor: default; }
    #practiceBtn.loading::after {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-left: 8px;
      border-radius: 50%;
      background: var(--gold);
      animation: vk-pulse 1s ease-in-out infinite;
      vertical-align: middle;
    }
    #practiceError {
      display: none;
      font-size: 11.5px;
      color: var(--coral);
      text-align: center;
    }
    #practiceResult {
      display: none;
      width: 100%;
      box-sizing: border-box;
      flex-direction: column;
      gap: 8px;
    }
    .practice-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 9px 12px;
      font-size: 12.5px;
      line-height: 1.5;
    }
    .practice-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .diff-removed {
      text-decoration: line-through;
      color: var(--coral);
      background: rgba(255, 107, 94, 0.15);
      border-radius: 3px;
      padding: 0 2px;
    }
    .diff-added {
      color: var(--mint);
      background: rgba(94, 234, 212, 0.15);
      border-radius: 3px;
      padding: 0 2px;
      font-weight: 600;
    }
    #practiceFavoriteBtn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-tertiary);
      padding: 0;
      line-height: 1;
    }
    #practiceFavoriteBtn:hover { color: var(--gold); }
    #practiceFavoriteBtn.favorited { color: var(--gold); }
    #practiceNotes {
      display: none;
      margin: 0;
      padding-left: 16px;
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    #practiceHistoryToggle {
      display: none;
      align-self: flex-start;
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 11px;
      text-decoration: underline;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
    }
    #practiceHistoryToggle:hover { color: var(--text-secondary); }
    #practiceHistoryList {
      display: none;
      width: 100%;
      max-height: 150px;
      overflow-y: auto;
      box-sizing: border-box;
      flex-direction: column;
      gap: 5px;
    }

    /* Middle column controls */
    #controls {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      width: 100%;
      flex-shrink: 0;
    }
    #navRow, #gradeRow {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
    }
    #controls button {
      border: none;
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      flex: 1;
      max-width: 140px;
    }
    #prevBtn, #nextBtn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--paper);
    }
    #prevBtn:hover, #nextBtn:hover { background: var(--surface-raised); }
    #prevBtn:disabled, #nextBtn:disabled { opacity: 0.35; cursor: default; }
    #knewIt, #remembered { background: var(--mint); color: var(--mint-ink); }
    #knewIt:hover, #remembered:hover { filter: brightness(1.08); }
    #forgot { background: var(--coral); color: #3a0f0a; }
    #forgot:hover { filter: brightness(1.08); }
    #alreadyGraded {
      font-size: 11.5px;
      color: var(--text-tertiary);
      display: none;
      text-align: center;
    }
    #lastResult {
      margin-top: 8px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11.5px;
      color: var(--text-secondary);
      min-height: 16px;
      text-align: center;
      flex-shrink: 0;
    }

    #empty {
      text-align: center;
      color: var(--text-secondary);
      max-width: 420px;
      margin: auto;
    }
    #empty h2 {
      font-family: "Fraunces", Georgia, serif;
      color: var(--paper);
      font-size: 24px;
    }

    @media (max-width: 900px) {
      body { height: auto; min-height: 100vh; overflow-y: auto; padding-bottom: 30px; }
      #reviewGrid { flex-direction: column; align-items: center; overflow: visible; }
      .col { overflow-y: visible; }
      .col-side, .col-mid { max-width: 460px; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <span class="brand-mark">Vokari</span>
    <span class="brand-tag">Review session</span>
  </div>
  <div id="scopeBar">
    <span>Scope</span>
    <select id="scope">
      <option value="due">Due now</option>
      <option value="days">Last N days</option>
      <option value="weeks">Last N weeks</option>
      <option value="months">Last N months</option>
    </select>
    <input id="amount" type="number" min="1" value="7" style="display:none;" />
    <span id="levelFilter">
      <label><input type="checkbox" class="lvl-cb" value="1" checked />L1</label>
      <label><input type="checkbox" class="lvl-cb" value="2" checked />L2</label>
      <label><input type="checkbox" class="lvl-cb" value="3" checked />L3</label>
      <label><input type="checkbox" class="lvl-cb" value="4" checked />L4</label>
      <label><input type="checkbox" class="lvl-cb" value="5" checked />L5</label>
    </span>
    <button id="startBtn">Go</button>
  </div>
  <div id="progress"></div>

  <div id="reviewGrid">
    <div class="col col-side" id="sentenceCol">
      <div class="col-heading">✨ AI Example</div>
      <div id="sentencePanel">
        <button id="sentenceBtn">✨ Make a sentence</button>
        <div id="sentenceBox">
          <button id="favoriteBtn" title="Save as favorite">☆</button>
          <div id="sentenceText"></div>
        </div>
        <button id="historyToggle"></button>
        <div id="historyList"></div>
        <div id="sentenceError"></div>
      </div>
    </div>

    <div class="col col-mid">
      <div id="card" style="display:none;">
        <div id="levelBadge"></div>
        <button id="speakBtn" title="Hear pronunciation">🔊</button>
        <div id="word"></div>
        <div id="translation"></div>
        <div id="context"></div>
        <div id="notes"></div>
        <div id="hint">Click the card to reveal the translation</div>
      </div>
      <div id="controls">
        <div id="navRow">
          <button id="prevBtn">◀ Prev</button>
          <button id="knewIt" title="Skip revealing the card and mark it remembered">✅ Knew it</button>
          <button id="nextBtn">Next ▶</button>
        </div>
        <div id="gradeRow" style="display:none;">
          <button id="forgot">❌ Forgot</button>
          <button id="remembered">✅ Remembered</button>
        </div>
        <div id="alreadyGraded"></div>
      </div>
      <div id="lastResult"></div>
    </div>

    <div class="col col-side" id="practiceCol">
      <div class="col-heading">📝 Your Practice</div>
      <div id="practicePanel">
        <div id="practiceIntro">Try writing your own sentence with "<span id="practiceWord"></span>"</div>
        <textarea id="practiceInput" rows="2" placeholder="Type a sentence using the word…"></textarea>
        <button id="practiceBtn">✨ Polish with AI</button>
        <div id="practiceError"></div>
        <div id="practiceResult">
          <div class="practice-box">
            <div class="practice-label"><span>Your sentence</span></div>
            <div id="practiceOriginalText"></div>
          </div>
          <div class="practice-box">
            <div class="practice-label">
              <span>Polished by AI</span>
              <button id="practiceFavoriteBtn" title="Save as favorite">☆</button>
            </div>
            <div id="practiceCorrectedText"></div>
          </div>
          <ul id="practiceNotes"></ul>
        </div>
        <button id="practiceHistoryToggle"></button>
        <div id="practiceHistoryList"></div>
      </div>
    </div>
  </div>

  <div id="empty" style="display:none;">
    <h2>All caught up 🎉</h2>
    <p>No words are due for review right now. Come back tomorrow, or keep highlighting new words as you read.</p>
  </div>
  <script src="review.js"></script>
</body>
</html>
