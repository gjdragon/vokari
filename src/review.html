<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Review — My Vocabulary</title>
  <style>
    body {
      margin: 0;
      background: #12141a;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    #scopeBar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #aaa;
      max-width: 460px;
      justify-content: center;
    }
    #scopeBar select, #scopeBar input {
      background: #1f2430;
      color: #eee;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 13px;
    }
    #scopeBar input[type="number"] {
      width: 46px;
    }
    #scopeBar button {
      background: #2a2f3a;
      color: #eee;
      border: none;
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    #scopeBar button:hover {
      background: #3a4050;
    }
    #levelFilter {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #levelFilter label {
      display: flex;
      align-items: center;
      gap: 2px;
      background: #1f2430;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 3px 6px;
      cursor: pointer;
      user-select: none;
    }
    #levelFilter input {
      margin: 0;
    }
    #progress {
      color: #888;
      font-size: 13px;
      margin-bottom: 18px;
    }
    #card {
      width: 420px;
      min-height: 220px;
      background: #1f2430;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      cursor: pointer;
      text-align: center;
      gap: 14px;
      position: relative;
    }
    #levelBadge {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 11px;
      color: #888;
      background: #12141a;
      border-radius: 10px;
      padding: 3px 9px;
    }
    #speakBtn {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: 15px;
      background: #12141a;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      color: #eee;
    }
    #speakBtn:hover {
      background: #2a2f3a;
    }
    #word {
      font-size: 28px;
      font-weight: 700;
    }
    #translation {
      font-size: 20px;
      color: #a9d6ff;
      display: none;
    }
    #context {
      font-size: 13px;
      color: #777;
      max-width: 340px;
    }
    #hint {
      font-size: 12px;
      color: #555;
    }
    #controls {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
    }
    #navRow, #gradeRow {
      display: flex;
      gap: 10px;
    }
    #controls button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: white;
    }
    #prevBtn, #nextBtn {
      background: #3a4050;
    }
    #prevBtn:disabled, #nextBtn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    #knewIt { background: #2ecc71; }
    #forgot { background: #e74c3c; }
    #remembered { background: #2ecc71; }
    #alreadyGraded {
      font-size: 12px;
      color: #888;
      display: none;
    }
    #lastResult {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
      min-height: 16px;
    }
    #empty {
      text-align: center;
      color: #888;
    }
    #empty h2 {
      color: #eee;
    }
  </style>
</head>
<body>
  <div id="scopeBar">
    <span>Review:</span>
    <select id="scope">
      <option value="due">Due now</option>
      <option value="days">Last N days</option>
      <option value="weeks">Last N weeks</option>
      <option value="months">Last N months</option>
    </select>
    <input id="amount" type="number" min="1" value="7" style="display:none;" />
    <span id="levelFilter">
      <label><input type="checkbox" class="lvl-cb" value="1" checked />L1</label>
      <label><input type="checkbox" class="lvl-cb" value="2" checked />L2</label>
      <label><input type="checkbox" class="lvl-cb" value="3" checked />L3</label>
      <label><input type="checkbox" class="lvl-cb" value="4" checked />L4</label>
      <label><input type="checkbox" class="lvl-cb" value="5" checked />L5</label>
    </span>
    <button id="startBtn">Go</button>
  </div>
  <div id="progress"></div>
  <div id="card" style="display:none;">
    <div id="levelBadge"></div>
    <button id="speakBtn" title="Hear pronunciation">🔊</button>
    <div id="word"></div>
    <div id="translation"></div>
    <div id="context"></div>
    <div id="hint">Click the card to reveal the translation</div>
  </div>
  <div id="controls">
    <div id="navRow">
      <button id="prevBtn">◀ Prev</button>
      <button id="knewIt">✅ Knew it</button>
      <button id="nextBtn">Next ▶</button>
    </div>
    <div id="gradeRow" style="display:none;">
      <button id="forgot">❌ Forgot</button>
      <button id="remembered">✅ Remembered</button>
    </div>
    <div id="alreadyGraded"></div>
  </div>
  <div id="lastResult"></div>
  <div id="empty" style="display:none;">
    <h2>All caught up 🎉</h2>
    <p>No words are due for review right now. Come back tomorrow, or keep highlighting new words as you read.</p>
  </div>
  <script src="review.js"></script>
</body>
</html>
